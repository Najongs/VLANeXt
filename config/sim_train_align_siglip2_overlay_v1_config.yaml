# overlay_v1 — SutureBot-style goal-pixel overlay finetune on top of champion v3.
# Hypothesis: explicit goal signal in the image solves precision-diagnosis #2
# (the model trains with GT trocar_entry_pos but had no goal signal at inference).
# Train UV: HDF5 keypoints_wrist[:, 2:4] (sim project_to_2d, normalized [0,1]).
# Test UV: KeypointInferencer (uv_only head, med 4.4px).

project:
  name: "VLANeXt_SigLIP2_overlay_v1"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_eval_range_v1"
    max_episodes: 1000
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/align_phantom_range_v1/collected_data_merged"
    max_episodes: 200

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 3000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

  # === SutureBot overlay (train) ===
  overlay:
    enabled: true
    color: [255, 0, 0]       # pure red (verified 0 collision in tool_camera frames)
    radius_px: 3             # 3px disk @ 640x480 → ~1.2px @ 256x256 after resize
    dropout_prob: 0.1        # 10% frames train without overlay (test-time KP head failures)
    jitter_std_px: 0.0       # start clean; add jitter only if predicted-UV ckpt underperforms

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  # Start from champion v3 (best precision so far). Weights only, fresh optimizer.
  pretrained_checkpoint: "/data/public/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_aux_strong_v3/checkpoint_1000.pt"
  reset_optimizer_scheduler: true
  learning_rate: 5.0e-6           # v3 recipe (catastrophic-forgetting safe)
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
