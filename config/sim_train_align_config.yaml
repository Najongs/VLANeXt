project:
  name: "VLANeXt_Qwen3.5_fine_align"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 5000
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_00"
  # - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/fine_align_01/collected_data_merged"
  # - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/fine_align_03/collected_data_merged"
  # - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/fine_align_04/collected_data_merged"
  # - path: "/home/najo/NAS/VLANeXt/dataset/fine_align_Random/uniform_new/collected_data_merged"
  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 102
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  # camera name mapping (HDF5 key names)
  # wrist camera as primary — side/top too far for fine alignment
  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    random_brightness: [0.2]
    random_contrast: [0.8, 1.2]
    random_saturation: [0.8, 1.2]
    random_hue: [0.05]
    augment_order:
      - "random_resized_crop"
      - "random_brightness"
      - "random_contrast"
      - "random_saturation"
      - "random_hue"

model:
  model_type: "vlanext"
  lmm_path: "Qwen/Qwen3.5-2B"  # "Qwen/Qwen3-VL-2B-Instruct" # 
  # vision_encoder_path: "google/siglip2-base-patch16-256"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

  action_dim: 6
  # 6-DoF EE delta + 2 sensor binary flags (sensor_close, hole_through). See sim_act_align.py.
  proprio_dim: 8
  use_sensor: true

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1024
  policy_depth: 29
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 29
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  # Auxiliary distance loss (sim-only — uses HDF5 needle_tip_pos / trocar_entry_pos).
  # Encourages predicted actions not to increase needle-tip → trocar distance.
  # Set enabled=false (or omit) when GT not available (e.g., real fine-tune).
  aux_distance_loss:
    enabled: true
    weight: 0.2                       # λ — bumped with tighter margin
    margin_mm: 0.05                    # tolerated distance increase (mm) — tightened from 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]  # MUST match action_max_sim_align[:3] (symmetric) — sim_act_align.py:28 (tip + trap)
    # Near-goal weighting: boost per-sample loss when needle tip close to trocar.
    # Targets BC underweight-near-goal: small actions → small absolute MSE → undertrained tail.
    # weight = 1 + clamp(near_goal_scale_mm / (cur_dist_mm + 1), max=near_goal_max_boost)
    # cur_dist=20mm → 1.24x;  10mm → 1.45x;  5mm → 1.83x;  2mm → 2.67x;  1mm → 3.50x
    near_goal_scale_mm: 5.0            # 0 to disable
    near_goal_max_boost: 5.0           # max sample weight = 1 + 4 = 5x
    apply_to_main_loss: true           # also reweight main action MSE

  # Direction-decoupled action loss (replaces MSE on main loss when enabled).
  # Splits position channels (first 3 dims) into magnitude and unit-direction terms:
  #   loss = α * (|a_pred| - |a_gt|)² + β * (1 - cos_sim) + γ * MSE(rot, gripper)
  # Targets BC near-goal direction blindness: when |a_gt|→0 plain MSE gives near-zero
  # signal regardless of predicted direction. Direction term keeps signal alive.
  direction_decoupled_loss:
    enabled: false                # baseline first — gnorm unstable with cosine grad
    pos_mag_weight: 0.5           # α
    pos_dir_weight: 0.1           # β
    other_weight: 1.0             # γ
    min_mag_threshold: 0.05

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: true
  dist_backend: "nccl"
  deepspeed:
    enabled: true
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
