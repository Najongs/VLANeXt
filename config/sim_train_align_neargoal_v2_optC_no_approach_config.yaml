# NEARGOAL v2 옵션 C (2026-05-20)
# Aggressive distribution shift: approach_00 + approach_eval_range_v1 + align_phantom_range_v1 모두 제거
# Fine-align 전담 학습: 10mm_fine_align_00_tip2 + NEARGOAL Track A + NEARGOAL Track B
#
# Rationale (v2_dual 결과):
#   - 옵션 B (approach_00 cap=5000) 5e-6 절반 lr → y=-25 mean 8.67 → 8.54 (-0.13mm only)
#   - 새 데이터 비중 4.6% 여전히 낮음. distribution rebalance 효과 미미
# Hypothesis: approach_00 완전 제거 → 새 데이터 분포가 dominant. y=-25 cells 학습 신호 강함
# Risk: wide-range approach 학습 손실 가능 (그러나 champion v3 weights에 이미 잘 학습됨, finetune이라 OK)
#
# Expected mix (~5K total):
#   10mm_fine_align_00_tip2: ~1000 ep, y=0 phantom 고정 (champion 데이터)
#   NEARGOAL_eval_match_v2 (full): ~3000 ep, 대칭 ±29
#   NEARGOAL_angle_only_v2 (full): ~1000 ep, 대칭 ±29, angle 15°
#
# Target: y=-25 mean 8.54 → <6mm (close_5mm 영역 진입), 27-cell SR 74.1% → 85%+

project:
  name: "VLANeXt_SigLIP2_NEARGOAL_v2_optC"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  # ===== approach_00 제거 (옵션 C 핵심) =====
  # ===== approach_eval_range_v1 / align_phantom_range_v1 제거 =====
  # ===== Champion fine-align 데이터만 유지 =====
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  # ===== NEW Track A: pos+angle 5mm, hold 60 =====
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_eval_match_v2/collected_data_merged"
  # ===== NEW Track B: angle-only 15°, hold 60 =====
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_angle_only_v2/collected_data_merged"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 3000      # v2_dual 2000보다 길게 — 새 분포 학습 시간 확보
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: "/home/najo/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_aux_strong_v3/checkpoint_1000.pt"
  reset_optimizer_scheduler: true
  learning_rate: 2.5e-6           # 사용자 의견 "lr 올리면 바보" → 2.5e-6 유지
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
