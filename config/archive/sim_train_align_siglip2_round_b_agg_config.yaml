data:
  augmentation:
    enabled: false
  batch_size: 16
  buffer_size: 4000
  cam_exterior: tool_camera
  cam_top: ''
  cam_wrist: ''
  data_root:
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/HARD_ang15_hold30_part2/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/HARD_y50_v1/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/HARD_yn25_xp15_v1/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/HARD_yn25_xp15_v1/collected_data_merged
  - path: /home/najo/NAS/VLANeXt/dataset/fine_align/HARD_yn25_xp15_v1/collected_data_merged
  dataset_name: sim_align
  full_sequence: true
  future_len: 8
  history_len: 8
  input_modality: image
  max_steps: 2000
  num_workers: 4
  skip_history_padding: true
  task_suite_name: ''
  view_mode: single
model:
  action_dim: 6
  action_vqvae:
    codebook_size: 1024
    depth: 4
    enabled: false
    frozen: true
    hidden_size: 256
    learning_rate: 0.001
    num_heads: 8
    steps: 1000
  aux_distance_loss:
    apply_to_main_loss: true
    enabled: true
    margin_mm: 0.1
    near_goal_max_boost: 10.0
    near_goal_scale_mm: 2.0
    pos_denorm_mm:
    - 0.37
    - 0.37
    - 0.37
    weight: 0.5
  backbone_mode: frozen
  condition_type: soft
  connector_depth: 2
  connector_num_heads: 4
  dct_freq_split: 0.125
  dct_high_freq_weight: 1.0
  dct_loss_weight: 0.1
  dct_low_freq_weight: 1.0
  dct_similarity_type: mae
  direction_decoupled_loss:
    enabled: false
    min_mag_threshold: 0.05
    other_weight: 1.0
    pos_dir_weight: 0.1
    pos_mag_weight: 0.5
  future_image_loss_weight: 0.0
  future_image_mode: horizon
  generator_depth: 24
  generator_hidden_size: 768
  generator_mlp_ratio: 4.0
  generator_num_heads: 12
  gradient_checkpointing: true
  lmm_path: vision_only
  lora:
    lora_alpha: 32
    lora_dropout: 0.05
    r: 16
    target_modules:
    - q_proj
    - v_proj
    - k_proj
    - out_proj
  loss_type: diffusion
  model_type: vlanext
  num_bins: 256
  num_inference_timesteps: 10
  num_queries: 32
  num_train_timesteps: 1000
  policy_depth: 24
  policy_hidden_size: 1152
  policy_mlp_ratio: 4.0
  policy_num_heads: 16
  projector_depth: 2
  projector_num_heads: 4
  proprio_dim: 6
  scheduler_type: flow_match
  use_action_input_policy: false
  use_proprio_input_vlm: true
  use_sensor: false
  use_transformer_connector: true
  use_transformer_proprio_projector: false
  vision_encoder_path: google/siglip2-so400m-patch16-512
project:
  log_interval: 1
  name: VLANeXt_SigLIP2_repro_b24_ft10mm_round_b_agg
  output_dir: /home/najo/NAS/VLANeXt/checkpoints
  save_interval: 500
  use_wandb: true
train:
  deepspeed:
    enabled: false
    offload_optimizer_device: none
    offload_param_device: none
    zero_stage: 2
  device: cuda
  dist_backend: nccl
  distributed: false
  gradient_accumulation_steps: 1
  learning_rate: 2.5e-06
  max_grad_norm: 1.0
  pretrained_checkpoint: /home/najo/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_y50_fill_v2/checkpoint_2000.pt
  reset_optimizer_scheduler: true
  resume_path: ''
  seed: 2033
  warmup_steps: 200
  weight_decay: 0.01
