project:
  name: "VLANeXt_SigLIP2_repro_b24_ft10mm_HOLD_focus_v2_seed2027"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 1000
  use_wandb: true

data:
  dataset_name: "sim_align"
  # HOLD focus v2: tip + tip2 둘 다 사용 (55% / 80% <5mm). 데이터 2배 + 평균 ~67% close.
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip/collected_data_merged"
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 3000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  # aux_strong sweet spot — NEW b100 trained with default(w 0.2/scale 5mm/boost 5x);
  # 5mm 정밀도 push 위해 sweet spot으로 업그레이드.
  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false
    pos_mag_weight: 0.5
    pos_dir_weight: 0.1
    other_weight: 1.0
    min_mag_threshold: 0.05

train:
  seed: 2027
  # Load NEW b100/20k weights as starting point (state_dict only, no optimizer).
  # pretrained_checkpoint = dir with pytorch_model.bin — train.py auto-detects.
  resume_path: ""
  reset_optimizer_scheduler: true
  # HOLD focus: continue from NEW_finetune best ckpt10000 (이미 검증된 best). tip2만으로 3k step 추가.
  pretrained_checkpoint: "/data/public/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_NEW_finetune/checkpoint_10000.pt"
  # lr 5e-6: continue-train below ceiling 1e-5. aux strong supervision needs lower lr to
  # stabilize transition from default-aux to strong-aux.
  learning_rate: 5.0e-6
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
