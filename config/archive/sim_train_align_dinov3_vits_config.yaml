project:
  name: "VLANeXt_DINOv3_vits16_fine_align"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 2500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  # Encoder/head 균형: 작은 vits16 (22M) + 가벼운 head (depth=8, hidden=384).
  # 거대 vitl16 + depth=24 조합으로 lr=1e-4가 gnorm 폭주 → 작게 줄여 안정화.
  model_type: "vlanext"
  lmm_path: "vision_only"
  # DINOv3 ViT-S/16: 384 dim, 12 layers, native 224 (14x14=196 patches).
  # visualization에서 needle/trocar에 가장 잘 attend한 모델.
  vision_encoder_path: "facebook/dinov3-vits16-pretrain-lvd1689m"
  input_image_size: 224          # native, viz에서 가장 task-relevant
  backbone_mode: "frozen"
  attn_implementation: "flash_attention_2"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 16                # 32 → 16 (head 가벼움)
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  # Head 대폭 축소: DP/ACT 수준 균형 맞춤.
  policy_hidden_size: 384        # match DINOv3-S hidden=384
  policy_depth: 8                # 24 → 8
  policy_num_heads: 6
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 384
  generator_depth: 8
  generator_num_heads: 6
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: false  # 작아서 필요 없음

  aux_distance_loss:
    enabled: true
    weight: 0.2
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 5.0
    near_goal_max_boost: 5.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    # DDL: position-channel loss를 magnitude/direction 으로 분리.
    # 켜려면 enabled: true. position approach 정밀도엔 도움.
    # ※ angle(rotation) 정밀도 부족이 주 병목이면 DDL보단 other_weight 키우는게 직접 효과.
    #   other_weight를 1.0→3.0~5.0으로 올리면 rotation channel MSE에 더 큰 가중치.
    enabled: false
    pos_mag_weight: 0.5      # |Δ| 크기 supervision
    pos_dir_weight: 0.1      # 1-cos(Δ_pred, Δ_gt) 방향 supervision
    other_weight: 1.0        # rotation+gripper 채널 weight — angle 부족하면 3~5로
    min_mag_threshold: 0.05  # 이 크기 미만 step은 direction supervision 스킵 (noise 방지)

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-5          # 1e-5 초과는 본 프로젝트에서 gnorm 폭주 일관됨 (사용자 경험)
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
