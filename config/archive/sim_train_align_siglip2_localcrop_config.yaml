project:
  # #B: #1과 단일변수 — local_crop_enabled.
  # tool_camera는 wrist-mounted (640×480, mode="fixed" but parented to tool body)이라
  # needle은 항상 같은 픽셀 위치 → 중앙 정사각형 crop ≈ needle ROI.
  # crop을 wrist 슬롯 view로 stack, view_mode=multi → 2 view (full + needle-zoom).
  # 효과: crop 안에서 patch당 world 거리 ~1/2 ↓, mm precision 신호 향상 기대
  name: "VLANeXt_SigLIP2_localcrop_fine_align"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 2000
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  # 2 views @ 512 → 2× 1024 = 2048 tokens. #1 1024 × 2 → 좀 더 무거움.
  # B=8 + grad_acc=2 = effective 16 (= #1)
  batch_size: 8
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "multi"

  cam_exterior: "tool_camera"
  cam_wrist: ""              # cam_wrist 자리에 local crop이 stack됨
  cam_top: ""

  local_crop_enabled: true
  local_crop_size: 320        # 640×480 중심 320×320 → resize 512 (zoom 2x on needle)

  augmentation:
    enabled: false

model:
  # Vision-only backbone — set lmm_path to the sentinel "vision_only" to skip LLM.
  # vision_encoder_path picks the SigLIP2 model used as the patch encoder.
  model_type: "vlanext"
  lmm_path: "vision_only"
  # SO400m at 512x512: 1152 dim, 27 layers, 32x32=1024 patches. Larger receptive
  # field useful for fine needle/trocar contact detection.
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"   # SigLIP2 backbone frozen; head/projector/queries trainable
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  # Sensor disabled for this run — proprio is ee_pose (6D) only.
  # Re-enable in later stage by switching to proprio_dim: 8 + use_sensor: true.
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  # SigLIP2 SO400m has 27 transformer layers (28 hidden states w/ embedding).
  # Keep policy_depth ≤ 27. policy_hidden_size matches SO400m's 1152.
  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.2
    # Action stats (compute_action_stats.py): pos delta max ~0.37mm/step (p99 ~0.36mm).
    # Cumulative over T=8: up to ~3mm. margin 0.1mm gives small slack per chunk —
    # was 0.05 before; loosened slightly since the symmetric ±0.37mm denorm matches
    # the empirical max well and 0.05 mm was below numerical noise floor on early steps.
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]   # matches action_max_sim_align[:3] (sim_act_align.py:40)
    near_goal_scale_mm: 5.0
    near_goal_max_boost: 5.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false
    pos_mag_weight: 0.5
    pos_dir_weight: 0.1
    other_weight: 1.0
    min_mag_threshold: 0.05

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-4    # backbone frozen → can go higher than VLM (1e-5)
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 2   # B=8 × acc=2 = effective 16 (= #1)
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false      # GPU 0 hardware fail + NVML probe 죽음 → single-GPU 강제. 살아나면 true로.
  dist_backend: "nccl"
  deepspeed:
    enabled: false        # distributed off일 땐 같이 끔
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
