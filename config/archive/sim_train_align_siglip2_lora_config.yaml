project:
  name: "VLANeXt_SigLIP2_LoRA_fine_align"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 2500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_00"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  # frozen SigLIP2 → SR 4% (위치 OK, angle bad). 같은 architecture에 LoRA만 추가해서
  # backbone이 task에 적응할 여지 제공. dense feature가 더 spatial-precise해지길 기대.
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "lora"          # frozen → lora 단일 변경
  attn_implementation: "flash_attention_2"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152       # SigLIP2-SO400m native
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true                # train.py 버그 fix 후라 이번엔 실제 적용됨
    weight: 0.2
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 5.0
    near_goal_max_boost: 5.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false
    pos_mag_weight: 0.5
    pos_dir_weight: 0.1
    other_weight: 1.0
    min_mag_threshold: 0.05

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
