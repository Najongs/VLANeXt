# NEARGOAL v2 dual finetune (2026-05-20)
# Plan B variant: approach_00 cap=5000 (1/3로 줄여 y=-25 distribution shift fix)
# Champion v3 (ckpt1000) base + Track A NEARGOAL_eval_match_v2 + Track B NEARGOAL_angle_only_v2
#
# Hypothesis: y=-25 천장은 데이터 분포 편향 ([[project_y_neg_distribution_bias]])
# Fix: approach_00 cap으로 +y 편향 줄이고, 새 대칭 phantom 데이터 추가
#
# Expected mix (~11K total):
#   approach_00 (cap 5000): ~5000 ep, y 비대칭 [-25, 75]
#   10mm_fine_align_00_tip2: ~1000 ep, y=0 고정
#   approach_eval_range_v1 (cap 1000): 대칭 ±29
#   align_phantom_range_v1 (cap 200): 대칭 ±29
#   NEARGOAL_eval_match_v2 (full ~3000): 대칭 ±29, perturb 5mm + angle 5°, hold 60
#   NEARGOAL_angle_only_v2 (full ~1000): 대칭 ±29, perturb XY=0 + angle 15°, hold 60
#
# Target: close_2mm 3.7% → 10%+, y=-25 mean 8.67 → <5mm

project:
  name: "VLANeXt_SigLIP2_NEARGOAL_v2_dual_finetune_qwen"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 5000   # sparse eval (250/500/1000/1500/final 중 500 단위)
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  # ===== Champion v3 mix (DOWN-SAMPLED to fix y+ bias) =====
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_00/collected_data_merged" # 5000
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_10k_v3/collected_data_merged" # 5000
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2" # 5000
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/align_small_angle_10k_v3" # 3000
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/align_10k_v3/collected_data_merged" # 3000
  # - path: "/home/najo/NAS/VLANeXt/dataset/real_align/collected_data_real_all" # 6000

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 100
  max_steps: 20000      # 짧게 — champion ckpt1000 baseline, finetune 2K 이내에 효과 확인
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  # augmentation (applied to image/video frames before processor)
  augmentation:
    enabled: true
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    random_brightness: [0.2]
    random_contrast: [0.8, 1.2]
    random_saturation: [0.8, 1.2]
    random_hue: [0.05]
    augment_order:
      - "random_resized_crop"
      - "random_brightness"
      - "random_contrast"
      - "random_saturation"
      - "random_hue"

model:
  model_type: "vlanext"
  lmm_path: "Qwen/Qwen3.5-2B"  # "Qwen/Qwen3-VL-2B-Instruct" # 
  # vision_encoder_path: "google/siglip2-base-patch16-256"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  # CRITICAL: champion v3 ckpt 1000 base (best so far)
  pretrained_checkpoint: ""
  reset_optimizer_scheduler: false
  learning_rate: 1e-5          # champion 5e-6의 절반 (catastrophic forgetting 보호)
  weight_decay: 0.01
  warmup_steps: 500               # short finetune이라 warmup 짧게
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: True
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
