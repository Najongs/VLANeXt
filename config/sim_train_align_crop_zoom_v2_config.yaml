# Crop & Zoom-in v2 (2026-05-21) — center crop + lr 1e-5
# v1 lessons:
#   - trocar UV 기반 crop + lr 1e-6 → catastrophic fail (loss 0.95, min_dist≈initial)
#   - 원인: visual distribution shock + lr 너무 낮음 → base에서 못 빠져나옴
# v2 changes:
#   - crop_mode: "trocar_uv" → "center" (UV 의존 제거, train/eval 일관성 안전)
#   - lr: 1e-6 → 1e-5 (10× ↑, distribution shift 극복용)
#   - max_steps: 2000 → 3000 (더 많은 회복 시간)
#   - warmup: 100 → 300 (큰 lr 안정화)
#
# 진단 신호 모니터링:
#   - Train loss: 정상 0.1-0.5, fail 신호 >0.7
#   - Gnorm: 정상 <10, fail 신호 30+ spike
#
# Target: close_5 ≥ 30% (v1=0% 대비, finetune로 회복 가능 여부 시험)

project:
  name: "VLANeXt_SigLIP2_NEARGOAL_crop_zoom_v2"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 500   # sparse eval (250/500/1000/1500/final 중 500 단위)
  use_wandb: true

data:
  dataset_name: "sim_align"
  # Crop & Zoom-in v2: center crop (UV 의존 제거).
  # tool_camera wrist-mounted → needle tip 항상 (0.488, 0.326) ≈ center.
  # Alignment phase에서 trocar는 tip 근처라 center crop으로 충분.
  crop_window_px: 256
  crop_target_size_px: 512
  crop_mode: "center"   # v1은 "trocar_uv" (fail), v2는 center로 일관성 확보
  data_root:
  # ===== Approach paths: NO crop (wide view 유지) =====
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_00"
    max_episodes: 2000   # extreme_rebal과 동일 spec (cap 2K)
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_eval_range_v1"
    max_episodes: 1000
  # ===== Alignment paths: crop_around_trocar=true =====
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
    crop_around_trocar: true
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/align_phantom_range_v1/collected_data_merged"
    max_episodes: 200
    crop_around_trocar: true
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_eval_match_v2/collected_data_merged"
    crop_around_trocar: true
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_angle_only_v2/collected_data_merged"
    crop_around_trocar: true

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 3000      # v1 lesson: distribution shift 회복엔 더 많은 step 필요
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  # CRITICAL: champion v3 ckpt 1000 base (best so far)
  pretrained_checkpoint: "/home/najo/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_aux_strong_v3/checkpoint_1000.pt"
  reset_optimizer_scheduler: true
  learning_rate: 1.0e-5           # v1 lesson: 1e-6은 distribution shift에 너무 작음
  weight_decay: 0.01
  warmup_steps: 300               # 큰 lr 안정화 (gnorm spike 방지)
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
