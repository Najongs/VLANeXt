# yneg finetune v1 (2026-05-21) — y<0 dedicated data 추가
# Hypothesis: extreme_rebal/continual은 cap 줄였지만 y=-25 그대로 (8.7mm, 2/9 SR).
# Track A에 y<0 26%밖에 없어서 dilute됨. y∈[-29,-10] 전용 1500ep 직접 주입으로 공격.
#
# Spec: extreme_rebal_v1 mix + NEARGOAL_yneg_v1 (1500ep) 추가
# - lr 1e-6 (검증된 안전 spec, distribution shift 없음 = data 추가만)
# - approach_00 cap 2000 (extreme_rebal와 동일)
# - max_steps 2000
# - Base: champion v3 ckpt 1000 (fresh, 효과 단독 측정)
#
# Mix 통계 (예상):
#   approach_00 (cap 2000): y 72% pos
#   10mm_fine_align_00_tip2: ~1000 y=0
#   approach_eval_range_v1 (cap 1000): 대칭
#   align_phantom_range_v1 (cap 200): 대칭
#   NEARGOAL_eval_match_v2 (full ~3000): 대칭 (y<0 26%)
#   NEARGOAL_angle_only_v2 (~262): 대칭
#   NEARGOAL_yneg_v1 (full 1500): y∈[-29,-10] 100% ← 신규
# 새 y<0 비중: 1500(전용) + 780(Track A y<0) = 2280 / ~7800 = ~29% (이전 21%)
#
# Target: y=-25 mean 8.7mm → <6mm OR y=-25 success 2/9 → 5/9+

project:
  name: "VLANeXt_SigLIP2_NEARGOAL_yneg_finetune_v1"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 500   # sparse eval (250/500/1000/1500/final 중 500 단위)
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  # ===== Champion v3 mix (DOWN-SAMPLED to fix y+ bias) =====
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"
    max_episodes: 2000   # 15K → 2K (EXTREME rebalance: 1/7.5로 줄임. y+ bias 대폭 제거)
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_eval_range_v1"
    max_episodes: 1000
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/align_phantom_range_v1/collected_data_merged"
    max_episodes: 200
  # ===== NEW Track A: pos+angle 5mm, hold 60, phantom ±29 대칭 =====
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/NEARGOAL_eval_match_v2/collected_data_merged"
    # max_episodes 없음 = full ~3000 (사용자 요청 데이터)
  # ===== NEW Track B: angle-only 15°, hold 60 =====
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/NEARGOAL_angle_only_v2/collected_data_merged"
    # full ~262 (IK_FAIL로 1000 → 262)
  # ===== NEW yneg dedicated: y ∈ [-29, -10] only, 1500 ep, hold 60 =====
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/NEARGOAL_yneg_v1/collected_data_merged"
    # full 1500 (사용자 요청, y<0 distribution rebalance 결정타 시험)

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 2000      # 짧게 — champion ckpt1000 baseline, finetune 2K 이내에 효과 확인
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  # CRITICAL: champion v3 ckpt 1000 base (best so far)
  pretrained_checkpoint: "/data/public/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_aux_strong_v3/checkpoint_1000.pt"
  reset_optimizer_scheduler: true
  learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup_steps: 100               # short finetune이라 warmup 짧게
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
