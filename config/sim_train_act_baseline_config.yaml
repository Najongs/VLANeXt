project:
  name: "ACT_baseline_align"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 5000
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  # 새 데이터 모두 모이면 아래 두 줄도 활성화:
  # - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_eval_range_v1"
  # - path: "/data/public/NAS/VLANeXt/dataset/fine_align/align_phantom_range_v1"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 64                  # ACT 가벼움 → 큰 batch OK
  max_steps: 30000
  num_workers: 2                  # 데이터 생성과 CPU 공유 중이므로 줄임 (생성 끝나면 늘려도 OK)

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "act"
  # VLANeXt 공통 키 — ACT는 대부분 무시하지만 train.py가 읽음
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"  # processor 호환용 (이미지 전처리 동일)
  action_dim: 6
  proprio_dim: 6
  use_sensor: false
  use_proprio_input_vlm: true
  use_action_input_policy: false
  # ACT-specific hyper-params (act_policy.py 기본값과 동일, override 가능)
  act:
    hidden_dim: 512
    num_encoder_layers: 4
    num_decoder_layers: 6
    num_heads: 8
    feedforward_dim: 2048
    dropout: 0.1
    latent_dim: 32
    kl_weight: 10.0
    vision_pretrained: true

train:
  seed: 2026
  resume_path: ""
  reset_optimizer_scheduler: true
  pretrained_checkpoint: ""
  learning_rate: 1.0e-4           # ACT 원본 default
  weight_decay: 1.0e-4
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
