project:
  name: "VLANeXt_SigLIP2_repro_b24_ft10mm_cotrain_lr_low"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 1000
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  # Sim fine-align (~5000 ep). MuJoCo convention auto-detected and converted to mecademic.
  - path: "/data/public/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  # Real (6000 ep). Mecademic convention auto-detected via infer_convention.
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0430"
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0501"
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0502"
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0503"
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0503_2"
  - path: "/data/public/NAS/VLANeXt/dataset/real_align/collected_data_real_0504"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 24
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "google/siglip2-so400m-patch16-512"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  # Aux loss DISABLED for real fine-tune:
  #   needle_tip_pos / trocar_entry_pos in real h5 come from sim ray-cast applied
  #   to commanded poses, not true tracking — noisier supervision target.
  aux_distance_loss:
    enabled: false
    weight: 0.2
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 5.0
    near_goal_max_boost: 5.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    enabled: false
    pos_mag_weight: 0.5
    pos_dir_weight: 0.1
    other_weight: 1.0
    min_mag_threshold: 0.05

train:
  seed: 2026
  # Resume from best sim fine-align ckpt (ft10mm SR ~33% on sim grid).
  resume_path: "/data/public/NAS/VLANeXt/checkpoints/VLANeXt_SigLIP2_repro/b24_ft10mm_fine_align/checkpoint_5000.pt"
  reset_optimizer_scheduler: true
  pretrained_checkpoint: ""
  # lr 2e-5: between continue-train (5e-6) and from-scratch (5e-5).
  # Real fine-tune has larger action delta range — slightly higher lr to adapt
  # the action head, but still well under the 1e-5 ceiling memory recorded for
  # this VLANeXt setup to avoid gnorm blowup.
  learning_rate: 5.0e-6
  weight_decay: 0.01
  warmup_steps: 200
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
