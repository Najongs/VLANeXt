project:
  name: "VLANeXt_finetune_sim_spatial"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 500
  use_wandb: true

data:
  dataset_name: "sim"
  data_root: "/data/public/NAS/VLANeXt/dataset/New1/collected_data_merged"
  task_suite_name: ""
  full_sequence: true

  history_len: 8
  future_len: 8
  buffer_size: 1000

  batch_size: 51
  max_steps: 20000
  num_workers: 4

  input_modality: "image"
  view_mode: "multi"

  # camera name mapping (HDF5 key names)
  cam_exterior: "side_camera"
  cam_wrist: "tool_camera"
  cam_top: "top_camera"

  augmentation:
    enabled: true
    random_resized_crop:
      scale: [0.8, 1.0]
      ratio: [0.9, 1.1]
    random_brightness: [0.2]
    random_contrast: [0.8, 1.2]
    random_saturation: [0.8, 1.2]
    random_hue: [0.05]
    augment_order:
      - "random_resized_crop"
      - "random_brightness"
      - "random_contrast"
      - "random_saturation"
      - "random_hue"

model:
  model_type: "vlanext"
  lmm_path: "Qwen/Qwen3-VL-2B-Instruct"
  vision_encoder_path: "google/siglip2-base-patch16-256"
  backbone_mode: "frozen"

  action_dim: 7

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 16
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  policy_hidden_size: 1024
  policy_depth: 29
  policy_num_heads: 16
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 29
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  spatial_loss_weight: 0.1

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

train:
  seed: 2026
  resume_path: "/data/public/NAS/VLANeXt/checkpoints/VLANeXt_finetune_sim/zero3"
  pretrained_checkpoint: ""
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: true
  dist_backend: "nccl"
  deepspeed:
    enabled: true
    zero_stage: 3
    offload_optimizer_device: "cpu"
    offload_param_device: "none"
