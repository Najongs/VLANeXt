project:
  name: "VLANeXt_DINOv3_vitb16_512_fine_align"
  output_dir: "/data/public/NAS/VLANeXt/checkpoints"
  log_interval: 1
  save_interval: 2500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/data/public/NAS/VLANeXt/dataset/approach/approach_00"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true

  history_len: 8
  future_len: 8
  buffer_size: 4000

  batch_size: 16
  max_steps: 10000
  num_workers: 4

  input_modality: "image"
  view_mode: "single"

  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""

  augmentation:
    enabled: false

model:
  # vits16(head 너무 작음, SR 0%) ↔ vitl16(head 너무 큼 + 발산) 사이 sweet spot.
  # DINOv3 ViT-B/16 (86M, hidden 768, 12 layers) + medium head (depth 12, hidden 768).
  # input 512 강제 → 32x32=1024 patches (SigLIP2-SO400m@512와 input-res-fair).
  model_type: "vlanext"
  lmm_path: "vision_only"
  vision_encoder_path: "facebook/dinov3-vitb16-pretrain-lvd1689m"
  input_image_size: 512
  backbone_mode: "frozen"
  attn_implementation: "flash_attention_2"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "out_proj"]

  action_dim: 6
  proprio_dim: 6
  use_sensor: false

  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3

  condition_type: "soft"
  num_queries: 24
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4

  # Medium head: depth 12 (vits=8, vitl=24의 중간), hidden 768 (match vitb).
  policy_hidden_size: 768
  policy_depth: 12
  policy_num_heads: 12
  policy_mlp_ratio: 4.0

  future_image_loss_weight: 0.0
  generator_hidden_size: 512
  generator_depth: 12
  generator_num_heads: 8
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"

  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"

  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true   # 1024 patches × depth 12 cross-attn → 메모리 확보

  aux_distance_loss:
    enabled: true
    weight: 0.2
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 5.0
    near_goal_max_boost: 5.0
    apply_to_main_loss: true

  direction_decoupled_loss:
    # toggleable. enabled: true 로 켜면 position magnitude/direction 분리 supervision.
    # angle 부족하면 other_weight를 3~5로 올려 rotation 가중치 강화.
    enabled: false
    pos_mag_weight: 0.5
    pos_dir_weight: 0.1
    other_weight: 1.0
    min_mag_threshold: 0.05

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: ""
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
