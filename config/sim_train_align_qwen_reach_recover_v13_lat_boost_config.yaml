# Qwen3.5-2B reach_recover v13 — v11 SOTA + aux_lateral boost
# (2026-05-24, EXPERIMENTS Section 32.5)
#
# Hypothesis: v11 ck1500 (close_2 77.8 + hold 48.1) 위에 aux_lateral weight 0.5→1.0으로 부스트.
# aux_hold가 hold 52% ceiling 안 깨면 → aux_lateral이 oscillation 다른 방식 억제 가능.
# 추가로 sub-mm data까지 있어 lat 정밀도 학습 신호 풍부.
#
# Recipe:
#   - base: v11 ck1500 (new balanced SOTA)
#   - lr 1.0e-7 (super gentle — v11 already optimal, 미세 조정)
#   - max_steps 1500
#   - aux_lateral weight 0.5 → 1.0 (2x boost)
#   - aux_hold threshold_mm 1.5 (v11 from)
#   - data: v11 + new submm_hold_v1 (already in v11)

project:
  name: "VLANeXt_Qwen35_NEARGOAL_reach_recover_v13_lat_boost"
  output_dir: "/home/najo/NAS/VLANeXt/checkpoints"
  log_interval: 5
  save_interval: 500
  use_wandb: true

data:
  dataset_name: "sim_align"
  data_root:
  - path: "/home/najo/NAS/VLANeXt/dataset/approach/approach_00"
    max_episodes: 2000
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/10mm_fine_align_00_tip2/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_eval_match_v2/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_angle_only_v2/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_yneg_hold_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_perfect_strict_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_perfect_hold_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_yneg_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_ypos_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_submm_hold_v1/collected_data_merged"
  - path: "/home/najo/NAS/VLANeXt/dataset/fine_align/NEARGOAL_submm_hold_v1/collected_data_merged"

  task_suite_name: ""
  full_sequence: true
  skip_history_padding: true
  history_len: 8
  future_len: 8
  buffer_size: 4000
  batch_size: 8
  max_steps: 1500
  num_workers: 4
  input_modality: "image"
  view_mode: "single"
  cam_exterior: "tool_camera"
  cam_wrist: ""
  cam_top: ""
  augmentation:
    enabled: false

model:
  model_type: "vlanext"
  lmm_path: "Qwen/Qwen3.5-2B"
  backbone_mode: "frozen"
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  action_dim: 6
  proprio_dim: 6
  use_sensor: false
  loss_type: "diffusion"
  num_train_timesteps: 1000
  num_inference_timesteps: 10
  scheduler_type: "flow_match"
  num_bins: 256
  action_vqvae:
    enabled: false
    frozen: true
    codebook_size: 1024
    hidden_size: 256
    depth: 4
    num_heads: 8
    steps: 1000
    learning_rate: 1.0e-3
  condition_type: "soft"
  num_queries: 32
  use_transformer_connector: true
  connector_depth: 2
  connector_num_heads: 4
  policy_hidden_size: 1152
  policy_depth: 24
  policy_num_heads: 16
  policy_mlp_ratio: 4.0
  future_image_loss_weight: 0.0
  generator_hidden_size: 768
  generator_depth: 24
  generator_num_heads: 12
  generator_mlp_ratio: 4.0
  future_image_mode: "horizon"
  dct_loss_weight: 0.1
  dct_freq_split: 0.125
  dct_low_freq_weight: 1.0
  dct_high_freq_weight: 1.0
  dct_similarity_type: "mae"
  use_proprio_input_vlm: true
  use_transformer_proprio_projector: false
  projector_depth: 2
  projector_num_heads: 4
  use_action_input_policy: false
  gradient_checkpointing: true

  aux_distance_loss:
    enabled: true
    weight: 0.5
    margin_mm: 0.1
    pos_denorm_mm: [0.37, 0.37, 0.37]
    near_goal_scale_mm: 2.0
    near_goal_max_boost: 10.0
    apply_to_main_loss: true

  aux_lateral_loss:
    enabled: true
    weight: 1.0   # v13: 2x boost (was 0.5)
    margin_mm: 0.05
    near_goal_scale_mm: 1.0
    near_goal_max_boost: 10.0

  aux_hold_loss:
    enabled: true
    pos_weight: 0.3
    rot_weight: 0.5
    threshold_mm: 1.5
    soft_scale_mm: 0.7

  direction_decoupled_loss:
    enabled: false

train:
  seed: 2026
  resume_path: ""
  pretrained_checkpoint: "/home/najo/NAS/VLANeXt/checkpoints/VLANeXt_Qwen35_NEARGOAL/reach_recover_v11_submm_tight/checkpoint_1500.pt"
  reset_optimizer_scheduler: true
  learning_rate: 1.0e-7
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  device: "cuda"
  distributed: false
  dist_backend: "nccl"
  deepspeed:
    enabled: false
    zero_stage: 2
    offload_optimizer_device: "none"
    offload_param_device: "none"
